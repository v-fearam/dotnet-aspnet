name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Verify .NET Installation
      run: |
        dotnet --version
        dotnet --list-sdks
    - name: Verify Docker & GitHub CLI Installation
      run: |
        docker --version
        gh --version 
    - name: Restore dependencies
      run: dotnet restore ./src/HelloWorldMvc/HelloWorldMvc.csproj
    
    - name: Build
      run: dotnet build ./src/HelloWorldMvc/HelloWorldMvc.csproj --no-restore --configuration Release
    
    - name: Test (if tests exist)
      run: dotnet test ./src/HelloWorldMvc/HelloWorldMvc.csproj --no-build --verbosity normal
      continue-on-error: true
    
    # Docker build removed - Not supported in Azure Container Apps
    # If you need Docker images, build them in a separate pipeline
    # with access to Docker daemon (e.g., Azure DevOps, GitHub-hosted runners)
